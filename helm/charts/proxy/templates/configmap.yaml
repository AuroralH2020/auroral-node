apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "proxy.fullname" . }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
data:
  default.conf: |
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=custom_cache:10m inactive=60m;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    upstream http_servers {
        server auroral-agent:4000;
    }

    server {
        listen 9997;
        server_name localhost;

        location / {
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Host $http_host;
            proxy_cache custom_cache;
            proxy_cache_bypass  $http_cache_control;
            add_header X-Proxy-Cache $upstream_cache_status;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass         http://http_servers;
        }
    }

    server {
      listen 8080;
      server_name localhost;

        location = / {
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Host $http_host;
            proxy_cache custom_cache;
            proxy_cache_bypass  $http_cache_control;
            add_header X-Proxy-Cache $upstream_cache_status;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass         http://http_servers/docs;
        }
        
        location / {
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Host $http_host;
            proxy_cache custom_cache;
            proxy_cache_bypass  $http_cache_control;
            add_header X-Proxy-Cache $upstream_cache_status;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass         http://http_servers;
        }

    }