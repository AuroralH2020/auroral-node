apiVersion: v1
kind: Service
metadata:
  name: "auroral-wothive"
  labels:
    {{- include "wothive.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "wothive.selectorLabels" . | nindent 4 }}
