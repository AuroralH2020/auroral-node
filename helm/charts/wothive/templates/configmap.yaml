apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wothive.fullname" . }}
  labels:
    {{- include "wothive.labels" . | nindent 4 }}
data:
  configuration.json: |
    {
      "triplestore":
      {
        "updateEnpoint": "http://auroral-triplestore:3030/wot-hive/update",
        "queryEnpoint": "http://auroral-triplestore:3030/wot-hive/query",
        "queryUsingGET": true
      },
        "service": {
        "directoryURIBase": "https://oeg.fi.upm.es/wothive/",
        "port": 9000,
        "maxThreads": 200,
        "minThreads": 2,
        "timeOutMillis": 30000,
        "eventsSize": 100,
        "eventsFile": "./events.json"
      },
      "validation": {
        "enableShaclValidation": false,
        "enableJsonSchemaValidation": true,
        "schemaFile": "./schema.json",
        "shapesFile": "./shape.ttl"
      }
    }