apiVersion: v1
kind: PersistentVolume
metadata:
    name: {{ include "cache.fullname" . }}-pv
{{- with .Values.volume }}
spec:
    {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: {{ include "cache.fullname" . }}-pvc
spec:
    accessModes:
        {{ .Values.volume.accessModes }}
    resources:
        requests:
            storage: {{ .Values.volume.capacity.storage | quote }}